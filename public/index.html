<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio | Photography</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #12141c;
      --text-main: #f0f2f5;
      --text-muted: #8a8f9d;
      --accent-color: #ffffff;
      --overlay-bg: rgba(5, 6, 8, 0.92);
      --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    header {
      padding: 3rem 2rem 2rem;
      text-align: center;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    header h1 {
      font-size: 2.25rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    main {
      flex: 1;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem 1.5rem 4rem;
    }

    /* CSS Columns Masonry Layout */
    .gallery-masonry {
      column-count: 1;
      column-gap: 1.25rem;
    }

    @media (min-width: 600px) {
      .gallery-masonry { column-count: 2; }
    }

    @media (min-width: 1024px) {
      .gallery-masonry { column-count: 3; }
    }

    @media (min-width: 1400px) {
      .gallery-masonry { column-count: 4; }
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 1.25rem;
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      background-color: var(--card-bg);
      cursor: pointer;
      transform: translateZ(0);
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.3s ease;
    }

    .gallery-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
    }

    .gallery-item img {
      width: 100%;
      height: auto;
      display: block;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .gallery-item img.loaded {
      opacity: 1;
    }

    /* Loading State */
    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5rem 0;
      color: var(--text-muted);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: var(--accent-color);
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Lightbox Modal */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--overlay-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .lightbox.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lightbox-img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }

    .lightbox-close, .lightbox-nav {
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      font-size: 1.5rem;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, transform 0.2s ease;
      user-select: none;
    }

    .lightbox-close:hover, .lightbox-nav:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.05);
    }

    .lightbox-close {
      top: 20px;
      right: 20px;
    }

    .lightbox-prev { left: 20px; top: 50%; transform: translateY(-50%); }
    .lightbox-next { right: 20px; top: 50%; transform: translateY(-50%); }

    @media (max-width: 768px) {
      .lightbox-prev { left: 10px; }
      .lightbox-next { right: 10px; }
      .lightbox-close { top: 10px; right: 10px; }
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <header>
    <h1 id="gallery-title">Gallery</h1>
    <p>Captured Moments</p>
  </header>

  <main>
    <div id="loader" class="loader-container">
      <div class="spinner"></div>
      <p>Loading gallery...</p>
    </div>

    <div id="gallery" class="gallery-masonry" style="display: none;"></div>
  </main>

  <!-- Lightbox Modal -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close modal">&times;</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous image">&#10094;</button>
    <div class="lightbox-content">
      <img id="lightbox-img" class="lightbox-img" src="" alt="Full resolution photo" />
    </div>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next image">&#10095;</button>
  </div>

  <footer>
    <p>&copy; <span id="year"></span> Photography Portfolio. Powered by Immich & Vercel.</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    let photos = [];
    let currentIndex = 0;

    const galleryContainer = document.getElementById('gallery');
    const loader = document.getElementById('loader');
    const galleryTitle = document.getElementById('gallery-title');

    // Lightbox Elements
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const closeBtn = document.getElementById('lightbox-close');
    const prevBtn = document.getElementById('lightbox-prev');
    const nextBtn = document.getElementById('lightbox-next');

    // Fetch photos from Vercel serverless API
    async function loadGallery() {
      try {
        const response = await fetch('/api/get-photos');
        if (!response.ok) throw new Error('Failed to fetch assets');
        
        const data = await response.json();
        photos = data.photos || [];

        if (data.albumTitle) {
          galleryTitle.textContent = data.albumTitle;
        }

        renderGallery(photos);
      } catch (err) {
        console.error(err);
        loader.innerHTML = '<p>Unable to load photo gallery. Please try again later.</p>';
      }
    }

    function renderGallery(items) {
      if (items.length === 0) {
        loader.innerHTML = '<p>No photos found in this album.</p>';
        return;
      }

      loader.style.display = 'none';
      galleryContainer.style.display = 'block';

      items.forEach((photo, index) => {
        const itemEl = document.createElement('div');
        itemEl.className = 'gallery-item';
        
        const img = document.createElement('img');
        img.src = photo.thumbnailUrl;
        img.alt = photo.title;
        img.loading = 'lazy';

        img.onload = () => img.classList.add('loaded');

        itemEl.addEventListener('click', () => openLightbox(index));
        itemEl.appendChild(img);
        galleryContainer.appendChild(itemEl);
      });
    }

    function openLightbox(index) {
      currentIndex = index;
      updateLightboxImage();
      lightbox.classList.add('active');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = 'auto';
      lightboxImg.src = '';
    }

    function updateLightboxImage() {
      const photo = photos[currentIndex];
      if (photo) {
        lightboxImg.src = photo.fullUrl;
        lightboxImg.alt = photo.title;
      }
    }

    function showNext() {
      currentIndex = (currentIndex + 1) % photos.length;
      updateLightboxImage();
    }

    function showPrev() {
      currentIndex = (currentIndex - 1 + photos.length) % photos.length;
      updateLightboxImage();
    }

    // Event Listeners
    closeBtn.addEventListener('click', closeLightbox);
    nextBtn.addEventListener('click', showNext);
    prevBtn.addEventListener('click', showPrev);

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') showNext();
      if (e.key === 'ArrowLeft') showPrev();
    });

    // Initialize
    loadGallery();
  </script>
</body>
</html>
